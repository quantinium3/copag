<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Copag - Color Palette Generator</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
	<header class="header">
		<div class="logo">
			<h1>Copag</h1>
		</div>
		<p class="hint">Press <strong>Space</strong> to generate a new palette!</p>
		<div class="global-controls">
			<button id="generate-btn" class="btn btn-primary">
				<i data-lucide="refresh-cw"></i> Generate
			</button>
			<button id="export-btn" class="btn btn-secondary">
				<i data-lucide="download"></i> Export
			</button>
		</div>
	</header>

	<main id="palette-container" class="palette-container">
	</main>

	<div id="export-modal" class="modal">
		<div class="modal-content">
			<span class="close-btn">&times;</span>
			<h2>Export Palette</h2>
			<div class="export-options">
				<div class="export-group">
					<label>HEX</label>
					<textarea id="export-hex" readonly></textarea>
					<button class="copy-btn" data-target="export-hex">Copy HEX</button>
				</div>
				<div class="export-group">
					<label>RGB</label>
					<textarea id="export-rgb" readonly></textarea>
					<button class="copy-btn" data-target="export-rgb">Copy RGB</button>
				</div>
				<div class="export-group">
					<label>HSL</label>
					<textarea id="export-hsl" readonly></textarea>
					<button class="copy-btn" data-target="export-hsl">Copy HSL</button>
				</div>
			</div>
		</div>
	</div>

	<div id="toast" class="toast">Copied to clipboard!</div>

	<script src="script.js"></script>
</body>

</html>
